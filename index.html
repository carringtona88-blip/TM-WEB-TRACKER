<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toxic Mafia Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#151a24;--mute:#5b6676;--line:#d5dae2;--met:#17744a;--below:#c1273f;--accent:#23395d;--accent-ink:#fff;--soft:#f2f4f8;--gold:#9a6f00;
--head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f131a;--panel:#181e28;--ink:#e9edf3;--mute:#98a3b3;--line:#2a3340;--met:#45c486;--below:#ff6b7f;--accent:#8fb0ec;--accent-ink:#0d1422;--soft:#1f2632;--gold:#e0b341}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.top{background:var(--accent);color:var(--accent-ink);padding:18px 20px 0}
.top-in,main{max-width:1100px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font:700 2rem/1 var(--head);margin:0 0 2px;letter-spacing:.01em}
.sub{margin:0 0 12px;opacity:.9;font-size:.9rem}
#refresh{font:inherit;font-size:.85rem;color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:5px 12px;cursor:pointer;opacity:.9}
nav{display:flex;gap:4px}
nav button{font:600 1.05rem var(--head);background:transparent;color:inherit;border:0;padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;opacity:.75}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:16px 20px 56px}
#banner{margin:0 0 12px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:.9rem}
#banner.warn{border-left:4px solid var(--below)}
#controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mute)}
select,input[type=search],.dd>summary{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
select{max-width:min(420px,88vw)}
input[type=search]{min-width:200px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dd{position:relative}
.dd>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;user-select:none}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary::after{content:"";width:6px;height:6px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translateY(-2px)}
.dd[open]>summary{border-color:var(--accent)}
.menu{position:absolute;z-index:6;top:calc(100% + 4px);left:0;min-width:230px;max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
.menu .acts{display:flex;gap:12px;padding:4px 8px 6px;font-size:.85rem}
.menu .acts a{color:var(--accent);cursor:pointer;text-decoration:underline}
.menu label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.93rem;color:var(--ink)}
.menu label:hover{background:var(--soft)}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin:2px 0 14px}
.fact{display:flex;flex-direction:column}
.fact b{font:700 1.5rem/1.1 var(--head)}
.fact.big b{font-size:2.1rem}
.fact span{font-size:.78rem;color:var(--mute)}
h2{font:700 1.4rem/1.2 var(--head);margin:0 0 8px}
h3{font:700 1.1rem/1.2 var(--head);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box ol{margin:0;padding:0;list-style:none}
.box li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.box li:last-child{border-bottom:0}
.box li b{font-weight:600}
.box li i{font-style:normal;color:var(--mute);white-space:nowrap}
.box.top-b{border-top:3px solid var(--met)}.box.bot-b{border-top:3px solid var(--below)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .95rem var(--head);color:var(--mute);white-space:nowrap;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill.met{color:var(--met)}.pill.below{color:var(--below)}.pill.none{color:var(--mute);border-color:var(--line)}
.meter{position:relative;height:8px;width:120px;background:var(--soft);border-radius:4px;border:1px solid var(--line)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.meter i.met{background:var(--met)}.meter i.below{background:var(--below)}
.meter u{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.7}
.note{color:var(--mute);font-size:.88rem;margin:0 0 12px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sugg button{font:inherit;font-size:.9rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer}
.small{font-size:.82rem;color:var(--mute)}
code{background:var(--soft);padding:1px 5px;border-radius:4px}
.strip{position:relative;height:16px;margin-top:12px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--below) 28%,transparent),color-mix(in srgb,var(--met) 28%,transparent))}
.strip i{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--ink);border:2px solid var(--panel)}
.cap{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute);margin-top:3px}
.sec{font:700 1.2rem/1.2 var(--head);margin:18px 0 8px}
.box .facts{margin:4px 0 4px}
.box .fact span{max-width:150px}
.pill.excused,.pill.quit{color:var(--accent)}
.pill.top3{color:var(--gold)}
.up{color:var(--met);font-weight:600}.down{color:var(--below);font-weight:600}
.mbar{display:flex;align-items:center;gap:8px;margin:6px 0}
.mbar b{width:38px;font:600 .95rem var(--head)}
.mbar div{flex:1;height:14px;background:var(--soft);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mbar div i{display:block;height:100%;background:var(--accent)}
.mbar div i.hi{background:var(--met)}.mbar div i.lo{background:var(--below)}
.mbar span{width:96px;font-size:.8rem;color:var(--mute);text-align:right}
.review{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.review p{margin:4px 0}
@media (max-width:640px){
 main{padding:14px 12px 48px}.top{padding:14px 12px 0}
 nav{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}nav button{padding:9px 12px;flex:none}
 #controls label.f{flex:1 1 44%;min-width:0}#controls select,#controls input[type=search]{width:100%;min-width:0;max-width:100%}
 .wrap{border:0;background:transparent;overflow:visible}
 table,tbody{display:block}thead{display:none}
 tr{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:4px 12px}
 td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);text-align:right!important}
 td:last-child{border-bottom:0}td:empty{display:none}
 td::before{content:attr(data-l);color:var(--mute);font-size:.8rem;text-align:left;flex:none}
 td[colspan]{display:block;text-align:center!important}td[colspan]::before{content:none}
 td details{text-align:right}
 .grid{grid-template-columns:1fr}.facts{gap:8px 18px}
}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="row">
    <div><h1>Toxic Mafia Scores</h1><p class="sub" id="src">Loading…</p></div>
    <button id="refresh" type="button">Refresh data</button>
  </div>
  <nav role="tablist" id="nav">

    <button role="tab" data-v="perf">Performance</button>
    <button role="tab" data-v="rank">Rankings</button>
    <button role="tab" data-v="watch">Watchlist</button>
  </nav>
</div></div>
<main>
  <div id="banner" hidden></div>
  <div id="controls"></div>
  <div id="out"></div>
</main>

function parseCSV(text){
  const out = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); cell = ""; out.push(row); row = []; }

  }

    l.innerHTML = '<input type="checkbox"><span></span>'; l.querySelector("span").textContent = o.l;
    const c = l.querySelector("input"); c.checked = sel.has(o.v);
    c.onchange = () => { c.checked ? sel.add(o.v) : sel.delete(o.v); upd(); onChange(); };
    menu.append(l);
  });
  menu.querySelector('[data-a=all]').onclick = () => { opts.forEach(o => sel.add(o.v)); menu.querySelectorAll("input").forEach(c => c.checked = true); upd(); onChange(); };
  menu.querySelector('[data-a=none]').onclick = () => { sel.clear(); menu.querySelectorAll("input").forEach(c => c.checked = false); upd(); onChange(); };
  upd(); d.append(s, menu); wrap.append(d); return wrap;
}

/* ============ PERFORMANCE ============ */
// Performance score: average position across contests, scaled 0-100 (100 = top of the field, 50 = middle).
const PCT = (e, p) => e.n > 1 ? (1 - (e.pos[p] - 1) / (e.n - 1)) * 100 : 100;
function perfStats(mSel, types){
  const P = {};
  M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => {
    if (e.ty === "Rank" || e.ty === "Average" || (types && !types.includes(e.ty))) return;
    Object.keys(e.s).forEach(p => {
      const r = P[p] || (P[p] = {p, n:0, sum:0, low:0, top:0, met:0, below:0, mo:{}});
      const x = PCT(e, p); r.n++; r.sum += x; if (x <= 25) r.low++; if (x >= 75) r.top++;
      const st = status(e, e.s[p], p); if (st === "met") r.met++; else if (st === "below") r.below++;
      const o = r.mo[mi] || (r.mo[mi] = {sum:0, n:0}); o.sum += x; o.n++;
    });
  }); });
  return Object.values(P).map(r => {
    const ms = Object.keys(r.mo).map(Number).sort((a, b) => a - b).map(mi => ({mi, avg: r.mo[mi].sum / r.mo[mi].n, n: r.mo[mi].n}));
    let delta = null;
    if (ms.length >= 2){ const prev = ms.slice(0, -1); delta = ms[ms.length-1].avg - prev.reduce((s, x) => s + x.avg, 0) / prev.length; }
    return {...r, avg: r.sum / r.n, ms, delta, trend: delta == null ? "New" : delta >= 5 ? "Improving" : delta <= -5 ? "Declining" : "Steady"};
  });
}
const trendTxt = r => r.delta == null ? "—" : r.trend === "Improving" ? `<span class="up">↑ +${Math.round(r.delta)}</span>` : r.trend === "Declining" ? `<span class="down">↓ ${Math.round(r.delta)}</span>` : "→ steady";
const hitTxt = r => (r.met + r.below) ? Math.round(r.met / (r.met + r.below) * 100) + "% (" + r.met + "/" + (r.met + r.below) + ")" : "—";

function reviewPanel(me, rk, total, mine){
  if (!me) return "";
  const lab = r => mon(r.mi) + ": " + r.e.t;
  const lvl = me.avg >= 75 ? "a top performer" : me.avg >= 55 ? "above average" : me.avg >= 40 ? "mid-table" : me.avg >= 25 ? "below average" : "near the bottom of the faction";
  const d = me.delta == null ? 0 : Math.abs(Math.round(me.delta));
  const best = [...mine].filter(r => r.e.ty !== "Rank" && r.e.ty !== "Average").sort((a, b) => a.pos / a.e.n - b.pos / b.e.n)[0];
  const lines = [
    `${esc(me.p)} is <b>${lvl}</b>: score ${Math.round(me.avg)} out of 100, number ${rk} of ${total} players.`,
    me.delta == null ? "Only one month of data so far, so there's no trend yet."
      : me.trend === "Improving" ? `<span class="up">Improving:</span> up ${d} points on earlier months.`
      : me.trend === "Declining" ? `<span class="down">Declining:</span> down ${d} points on earlier months.` : "Trend is steady compared with earlier months.",
    me.n >= 3 && me.low / me.n >= 0.6 ? `<span class="down">Constantly near the bottom:</span> bottom quarter in ${me.low} of ${me.n} contests.`
      : me.low ? `Bottom quarter in ${me.low} of ${me.n} contests.` : "Never in the bottom quarter of a contest.",
    (me.met + me.below) ? `Met the 1% value in ${me.met} of ${me.met + me.below} contests (${Math.round(me.met / (me.met + me.below) * 100)}%).` : "",
    best ? `Best result: ${esc(lab(best))} (position ${best.pos} of ${best.e.n}).` : ""
  ].filter(Boolean);
  return `<h3 class="sec">Performance review</h3>

      ${me.ms.map(x => `<div class="mbar"><b>${esc(mon(x.mi))}</b><div><i class="${x.avg >= 60 ? "hi" : x.avg <= 35 ? "lo" : ""}" style="width:${Math.max(2, x.avg)}%"></i></div><span>${Math.round(x.avg)} · ${x.n} contests</span></div>`).join("")}</div>`;
}

const statFact = (b, s, sub) => `<div class="fact"><b>${b}</b><span>${s}${sub ? "<br>" + esc(sub) : ""}</span></div>`;
function playerStats(mine, N = 5){
  const core = mine.filter(r => r.e.ty !== "Rank" && r.e.ty !== "Average");
  if (!core.length) return "";
  const lab = r => mon(r.mi) + ": " + r.e.t;
  const GROUPS = [["Kick offs", ["Kick Off"]], ["Feuds", ["Feud", "Flash Feud", "Flash Feud Total"]], ["Faction contests", ["Faction Contest", "Loot Contest", "Boss Battle"]]];
  const strip = (pts, cap) => `<div class="strip" aria-hidden="true">${pts.map(p => `<i style="left:${(p.x*100).toFixed(1)}%" title="${esc(p.t)}"></i>`).join("")}</div><div class="cap"><span>worse</span><span>${cap}</span><span>better</span></div>`;
  const cards = GROUPS.map(([label, types]) => {
    const rs = core.filter(r => types.includes(r.e.ty)); if (!rs.length) return "";
    const sc = rs.filter(r => r.e.m === "score"), rk = rs.filter(r => r.e.m === "rank");
    let facts = "", strips = "";
    if (sc.length){
      const hi = sc.reduce((a, r) => r.v > a.v ? r : a), lo = sc.reduce((a, r) => r.v < a.v ? r : a), avg = sc.reduce((s, r) => s + r.v, 0) / sc.length;
      facts += statFact(fmt(hi.v), "Best score", lab(hi)) + statFact(fmt(lo.v), "Lowest score", lab(lo)) + statFact(fmt(avg), "Average score");
      strips += strip(sc.map(r => ({x: hi.v ? r.v / hi.v : 0, t: lab(r) + " · " + fmt(r.v)})), "each dot = a score");
    }
    if (rk.length){
      const b = rk.reduce((a, r) => r.v < a.v ? r : a), w = rk.reduce((a, r) => r.v > a.v ? r : a);
      facts += statFact("Rank " + fmt(b.v), "Best rank", lab(b)) + statFact("Rank " + fmt(w.v), "Worst rank", lab(w));
      strips += strip(rk.map(r => ({x: 1 - (Math.min(r.v, 100) - 1) / 99, t: lab(r) + " · rank " + fmt(r.v)})), "each dot = a rank");
    }
    return `<div class="box"><h3>${label} <span class="small">· ${rs.length} entered</span></h3><div class="facts">${facts}</div>${strips}</div>`;
  }).join("");
  const sorted = [...core].sort((a, b) => a.pos / a.e.n - b.pos / b.e.n);
  const li = r => `<li><b>${esc(lab(r))}</b><i>${r.e.m === "rank" ? "Rank " + fmt(r.v) : fmt(r.v)} · ${r.pos} of ${r.e.n}</i></li>`;
  return `<h3 class="sec">Player stats</h3>
    <div class="grid">${cards}</div>
    <div class="grid">
      <div class="box top-b"><h3>Best ${N} results</h3><ol>${sorted.slice(0, N).map(li).join("")}</ol></div>
      <div class="box bot-b"><h3>Lowest ${N} results</h3><ol>${sorted.slice(-N).reverse().map(li).join("")}</ol></div>
    </div>
    <p class="note">Best and lowest 5 compare results by position in each contest, so a kick off and a feud can be ranked fairly. Dots on the bars: right is better, and hovering a dot shows the contest.</p>
    <h3 class="sec">Contest history</h3>`;
}

    html($("#out"), `
      <h2>${esc(name)}${rosterPill(name)}</h2>
      ${(() => { const PS = perfStats(mSel), me = PS.find(x => x.p === name); return reviewPanel(me, [...PS].sort((a, b) => b.avg - a.avg).findIndex(x => x.p === name) + 1, PS.length, mine); })()}
      ${playerStats(mine, N)}
      <div class="facts">
        <div class="fact"><b>${rows.length}</b><span>Entries shown</span></div>
        <div class="fact"><b style="color:var(--met)">${met}</b><span>Met 1%</span></div>
        <div class="fact"><b style="color:var(--below)">${judged.length - met}</b><span>Below 1%</span></div>
      </div>
      ${sh !== "all" ? '<p class="note">Best and lowest are judged by position in each contest, so different contests compare fairly.</p>' : ""}
      <div class="wrap"><table><thead><tr><th>Month</th><th>Contest</th><th>Type</th><th class="n">Score / rank</th><th class="n">Position</th><th class="n">1% value</th><th>Progress</th><th class="n">% of target</th><th>Status</th></tr></thead><tbody>
      ${shown.length ? shown.map(r=>`<tr><td>${esc(mon(r.mi))}</td><td>${esc(r.e.t)}</td><td>${esc(r.e.ty)}</td><td class="n">${r.e.m==="rank" ? "Rank " + fmt(r.v) : fmt(r.v)}</td><td class="n">${r.pos} of ${r.e.n}</td><td class="n">${r.e.m==="score"?short(r.e.op):""}</td><td>${meter(r.e,r.v)}</td><td class="n">${pctOf(r.e,r.v)}</td><td>${pill(r.st)}</td></tr>`).join("")
        : '<tr><td colspan="9" class="empty">No entries for these filters.</td></tr>'}
      </tbody></table></div>`);
  }
  draw();
}

/* ============ RANKINGS VIEW ============ */
// Uses every contest where the sheet records a rank (1 is best). "Average" columns are skipped to avoid counting twice.
function rankStats(mSel, types){
  const P = {};
  M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => {
    if (e.m !== "rank" || e.ty === "Average" || (types && !types.includes(e.ty))) return;
    Object.entries(e.s).forEach(([p, v]) => {
      const r = P[p] || (P[p] = {p, n:0, sum:0, best:Infinity, worst:0, list:[]});
      r.n++; r.sum += v; r.best = Math.min(r.best, v); r.worst = Math.max(r.worst, v);
      r.list.push(mon(mi) + ": " + e.t + " (rank " + fmt(v) + ")");
    });
  }); });
  return Object.values(P).map(r => ({...r, avg: r.sum / r.n}));
}
function viewRank(){
  const mSel = new Set(M.map((_, i) => i));
  html($("#controls"), `<label class="f">Search player<input type="search" id="pq" placeholder="Type a name"></label>
    <label class="f">Contests<select id="cat">${catKeys().map(k=>`<option>${esc(k)}</option>`).join("")}</select></label>`);
  $("#controls").append(multi("Months", monthOpts, mSel, draw));
  $("#pq").oninput = draw; $("#cat").onchange = draw;
  function draw(){
    const all = rankStats(mSel, CATS[$("#cat").value]).sort((a, b) => a.avg - b.avg || b.n - a.n);
    if (!all.length) return html($("#out"), '<div class="empty">No rank data for these filters.</div>');
    const maxN = Math.max(...all.map(r => r.n)), pool = all.filter(r => r.n >= Math.ceil(maxN / 2));
    const q = $("#pq").value.trim().toLowerCase();
    const li = r => `<li><b>${esc(r.p)}</b><i>avg ${r.avg.toFixed(1)} · best ${r.best}</i></li>`;
    html($("#out"), `
      <p class="note">Rank 1 is best. This averages each player's rank across every contest where the sheet records a rank. The top and bottom 5 only include players who appear in at least half as many contests as the most active player (${Math.ceil(maxN/2)}+).</p>
      <div class="grid">
        <div class="box top-b"><h3>Top 5 average rank</h3><ol>${pool.slice(0,5).map(li).join("")}</ol></div>
        <div class="box bot-b"><h3>Bottom 5 average rank</h3><ol>${pool.slice(-5).reverse().map(li).join("")}</ol></div>
      </div>
      <div class="wrap"><table><thead><tr><th class="n">#</th><th>Player</th><th class="n">Contests ranked</th><th class="n">Avg rank</th><th class="n">Best</th><th class="n">Worst</th><th>Ranks by contest</th></tr></thead><tbody>
      ${(() => { const rows = all.map((r, i) => ({...r, i: i + 1})).filter(r => !q || r.p.toLowerCase().includes(q));
        return rows.length ? rows.map(r=>`<tr><td class="n">${r.i}</td><td>${esc(r.p)}</td><td class="n">${r.n}</td><td class="n">${r.avg.toFixed(1)}</td><td class="n">${r.best}</td><td class="n">${r.worst}</td><td class="small"><details><summary>Show</summary>${r.list.map(esc).join("<br>")}</details></td></tr>`).join("")
          : '<tr><td colspan="7" class="empty">No players match.</td></tr>'; })()}
      </tbody></table></div>`);
  }
  draw();
}

/* ============ WATCHLIST VIEW ============ */
function viewWatch(){
  const mSel = new Set(M.map((_, i) => i)), tSel = new Set(allTypes);
  html($("#controls"), `<label class="f">Search player<input type="search" id="pq" placeholder="Type a name"></label>
    <label class="f">Show<select id="sf"><option value="all">All players</option><option value="below">Below 1% at least once</option><option value="clean">Never below 1%</option></select></label>`);
  $("#controls").append(multi("Months", monthOpts, mSel, draw), multi("Contest types", typeOpts, tSel, draw));
  $("#pq").oninput = draw; $("#sf").onchange = draw;
  function draw(){
    const P = {};
    M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => {
      if (!tSel.has(e.ty) || e.m !== "score" || !e.op) return;
      Object.entries(e.s).forEach(([p, v]) => {
        const r = P[p] || (P[p] = {p, met:0, below:0, ex:0, miss:[]});
        if (v >= e.op) r.met++; else if (EXEMPT.includes((e.f || {})[p])) r.ex++; else { r.below++; r.miss.push(mon(mi) + ": " + e.t + " (" + fmt(v) + " / " + short(e.op) + ")"); }
      });
    }); });
    const all = Object.values(P).map(r => ({...r, n: r.met + r.below, pct: r.met / (r.met + r.below)}));
    const rs = Object.fromEntries(rankStats(mSel, [...tSel]).map(r => [r.p, r]));
    const ro = []; M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => { if (e.m === "rank" && e.op && tSel.has(e.ty)) ro.push(mon(mi) + ": " + e.t + " (1% value " + short(e.op) + ")"); }); });
    const ranked = [...all].sort((a,b) => b.pct - a.pct || b.n - a.n);
    const q = $("#pq").value.trim().toLowerCase(), sf = $("#sf").value;
    const rows = [...all].sort((a,b) => b.below - a.below || a.pct - b.pct)
      .filter(r => (!q || r.p.toLowerCase().includes(q)) && (sf === "all" || (sf === "below" ? r.below > 0 : r.below === 0)));
    const li = r => `<li><b>${esc(r.p)}</b><i>${r.met}/${r.n} met · ${Math.round(r.pct*100)}%</i></li>`;
    html($("#out"), all.length ? `
      <p class="note">Players are checked against the 1% value written in the sheet (14k, 120m, 1.8m and so on) for every contest that has both a score and a 1% value. A blank cell means the player wasn't listed for that contest; a 0 counts as below. ${haveFlags() ? "Contests marked Excused or Quit Faction in the sheet key are not counted against a player." : "The colour key (Excused, Quit Faction) isn't being read in this mode, so those players currently count as below."}</p>
      ${ro.length ? `<details class="note"><summary>${ro.length} contests have a 1% value but the sheet only records a rank, so they can't be checked. Show them.</summary>${ro.map(esc).join("<br>")}</details>` : ""}
      <div class="grid">
        <div class="box top-b"><h3>Top 5 hit rate</h3><ol>${ranked.slice(0,5).map(li).join("")}</ol></div>
        <div class="box bot-b"><h3>Bottom 5 hit rate</h3><ol>${ranked.slice(-5).reverse().map(li).join("")}</ol></div>
      </div>
      <div class="wrap"><table><thead><tr><th>Player</th><th class="n">Contests</th><th class="n">Met</th><th class="n">Below</th><th class="n">Hit rate</th><th class="n">Avg rank</th><th>Contests below 1% value</th></tr></thead><tbody>
      ${rows.length ? rows.map(r=>`<tr><td>${esc(r.p)}${rosterPill(r.p)}</td><td class="n">${r.n}</td><td class="n" style="color:var(--met)">${r.met}</td><td class="n" style="color:var(--below)">${r.below}</td><td class="n">${Math.round(r.pct*100)}%</td><td class="n">${rs[r.p] ? rs[r.p].avg.toFixed(1) : "—"}</td>
        <td class="small">${r.miss.length ? `<details><summary>${r.miss.length} below</summary>${r.miss.map(esc).join("<br>")}</details>` : "None"}${r.ex ? `<div>${r.ex} excused or left (not counted)</div>` : ""}</td></tr>`).join("")
        : '<tr><td colspan="7" class="empty">No players match.</td></tr>'}
      </tbody></table></div>` : '<div class="empty">No contests have both a score and a 1% value for these filters.</div>');
  }
  draw();
}

/* ============ TABS & START ============ */
const views = {event: viewEvent, player: viewPlayer, perf: viewPerf, rank: viewRank, watch: viewWatch};
function go(v){
  current = v;
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  if (!M.length){ html($("#controls"), ""); return html($("#out"), '<div class="empty">No data to show yet.</div>'); }
  views[v](); history.replaceState(null, "", "#" + v);
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));
$("#refresh").onclick = async () => { await load(); go(current); };
(async () => { await load(); go(views[location.hash.slice(1)] ? location.hash.slice(1) : "event"); })();
</script>
