<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toxic Mafia Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#151a24;--mute:#5b6676;--line:#d5dae2;--met:#17744a;--below:#c1273f;--accent:#23395d;--accent-ink:#fff;--soft:#f2f4f8;--gold:#9a6f00;
--head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f131a;--panel:#181e28;--ink:#e9edf3;--mute:#98a3b3;--line:#2a3340;--met:#45c486;--below:#ff6b7f;--accent:#8fb0ec;--accent-ink:#0d1422;--soft:#1f2632;--gold:#e0b341}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.top{background:var(--top,var(--accent));color:var(--top-ink,var(--accent-ink));padding:18px 20px 0}
.top-in,main{max-width:1100px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font:700 2rem/1 var(--head);margin:0 0 2px;letter-spacing:.01em}
.sub{margin:0 0 12px;opacity:.9;font-size:.9rem}
#refresh{font:inherit;font-size:.85rem;color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:5px 12px;cursor:pointer;opacity:.9}
nav{display:flex;gap:4px}
nav button{font:600 1.05rem var(--head);background:transparent;color:inherit;border:0;padding:9px 16px;border-radius:8px 8px 0 0;cursor:pointer;opacity:.75}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:16px 20px 56px}
#banner{margin:0 0 12px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:.9rem}
#banner.warn{border-left:4px solid var(--below)}
#controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--mute)}
select,input[type=search],.dd>summary{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
select{max-width:min(420px,88vw)}
input[type=search]{min-width:200px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dd{position:relative}
.dd>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;user-select:none}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary::after{content:"";width:6px;height:6px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translateY(-2px)}
.dd[open]>summary{border-color:var(--accent)}
.menu{position:absolute;z-index:6;top:calc(100% + 4px);left:0;min-width:230px;max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
.menu .acts{display:flex;gap:12px;padding:4px 8px 6px;font-size:.85rem}
.menu .acts a{color:var(--accent);cursor:pointer;text-decoration:underline}
.menu label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.93rem;color:var(--ink)}
.menu label:hover{background:var(--soft)}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin:2px 0 14px}
.fact{display:flex;flex-direction:column}
.fact b{font:700 1.5rem/1.1 var(--head)}
.fact.big b{font-size:2.1rem}
.fact span{font-size:.78rem;color:var(--mute)}
h2{font:700 1.4rem/1.2 var(--head);margin:0 0 8px}
h3{font:700 1.1rem/1.2 var(--head);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box ol{margin:0;padding:0;list-style:none}
.box li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.box li:last-child{border-bottom:0}
.box li b{font-weight:600}
.box li i{font-style:normal;color:var(--mute);white-space:nowrap}
.box.top-b{border-top:3px solid var(--met)}.box.bot-b{border-top:3px solid var(--below)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .95rem var(--head);color:var(--mute);white-space:nowrap;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill.met{color:var(--met)}.pill.below{color:var(--below)}.pill.none{color:var(--mute);border-color:var(--line)}
.meter{position:relative;height:8px;width:120px;background:var(--soft);border-radius:4px;border:1px solid var(--line)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.meter i.met{background:var(--met)}.meter i.below{background:var(--below)}
.meter u{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.7}
.note{color:var(--mute);font-size:.88rem;margin:0 0 12px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sugg button{font:inherit;font-size:.9rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer}
.small{font-size:.82rem;color:var(--mute)}
code{background:var(--soft);padding:1px 5px;border-radius:4px}
.strip{position:relative;height:16px;margin-top:12px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--below) 28%,transparent),color-mix(in srgb,var(--met) 28%,transparent))}
.strip i{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--ink);border:2px solid var(--panel)}
.cap{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute);margin-top:3px}
.sec{font:700 1.2rem/1.2 var(--head);margin:18px 0 8px}
.box .facts{margin:4px 0 4px}
.box .fact span{max-width:150px}
.pill.excused,.pill.quit{color:var(--accent)}
.pill.top3{color:var(--gold)}
.up{color:var(--met);font-weight:600}.down{color:var(--below);font-weight:600}
.mbar{display:flex;align-items:center;gap:8px;margin:6px 0}
.mbar b{width:38px;font:600 .95rem var(--head)}
.mbar div{flex:1;height:14px;background:var(--soft);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mbar div i{display:block;height:100%;background:var(--accent)}
.mbar div i.hi{background:var(--met)}.mbar div i.lo{background:var(--below)}
.mbar span{width:96px;font-size:.8rem;color:var(--mute);text-align:right}
.review{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.review p{margin:4px 0}
@media (max-width:640px){
 main{padding:14px 12px 48px}.top{padding:14px 12px 0}
 nav{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}nav button{padding:9px 12px;flex:none}
 #controls label.f{flex:1 1 44%;min-width:0}#controls select,#controls input[type=search]{width:100%;min-width:0;max-width:100%}
 .wrap{border:0;background:transparent;overflow:visible}
 table,tbody{display:block}thead{display:none}
 tr{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:4px 12px}
 td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);text-align:right!important}
 td:last-child{border-bottom:0}td:empty{display:none}
 td::before{content:attr(data-l);color:var(--mute);font-size:.8rem;text-align:left;flex:none}
 td[colspan]{display:block;text-align:center!important}td[colspan]::before{content:none}
 td details{text-align:right}
 .grid{grid-template-columns:1fr}.facts{gap:8px 18px}
}
.health{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.health.strong{border-left-color:var(--met)}.health.attention{border-left-color:var(--below)}
.hbadge{font:700 1.3rem/1.1 var(--head);padding:6px 12px;border-radius:8px;background:var(--soft);white-space:nowrap}
.health.strong .hbadge{color:var(--met)}.health.attention .hbadge{color:var(--below)}
.health ul{margin:6px 0;padding-left:18px}.health p{margin:6px 0 0}
.steps{margin:8px 0 8px 18px;padding:0}.steps li{margin:5px 0}
details.box>summary{cursor:pointer}
@media (max-width:640px){.health{flex-direction:column}}
.pill.role{color:var(--accent)}
.top{border-bottom:1px solid var(--line)}
.by{margin:0 0 4px;font-size:.85rem;opacity:.8;letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:12px}#logo{height:52px;width:auto;border-radius:8px}
</style>
</head>

    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); cell = ""; out.push(row); row = []; }
    else cell += c;
  }

const num = v => {
  if (v == null) return null;

  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, "");   // 19,850,827,885 and typos like 70.371,507
  s = s.replace(/,/g, "");
  const m = s.match(/^([\d.]+)\s*([kmb]?)$/);

};
const rankNum = v => { const m = String(v ?? "").match(/\d+/); return m ? +m[0] : null; };
function kind(t){
  t = t.toLowerCase();
  if (t.includes("rank for")) return "Rank";
  if (t.includes("average")) return "Average";
  if (t.includes("showdown")) return "Showdown Contest";
  if (t.includes("faction contest") && t.includes("flash")) return "Faction Contest";
  if (/total|combined/.test(t)) return "Flash Feud Total";
  if (/flash\s*fe?u+e?d\s*\d|\bfe?u+e?d\s*[1-4]\b/.test(t)) return "Flash Feud";   // "Feud 1" to "Feud 4" are the four flash feuds too
  if (t.includes("boss battle")) return "Boss Battle";
  if (/kick\s*off/.test(t)) return "Kick Off";
  if (/\bfe?u+e?d\b/.test(t)) return "Feud";
  if (t.includes("loot")) return "Loot Contest";

}
// Key colours from the sheet (only available when the Google script link is used)
// Codes typed in the sheet: (EX) excused, (QF) quit faction, (JO)/(J0)/(J) joined. Colours are only a fallback.
const TOK = /\(\s*(EX|QF|J[O0]?)\s*\)/gi;
const ROLE = /\s*\((LD|EF|OF|CO)\)\s*$/i;   // management role written after a name, e.g. "A Bigs (OF)"
function cellParse(raw){
  let flag = "";
  const rest = String(raw == null ? "" : raw).replace(TOK, (m, c) => { c = c.toUpperCase(); flag = c === "EX" ? "excused" : c === "QF" ? "quit" : "new"; return ""; }).trim();
  return {v: num(rest), flag};
}
const FLAG = {f4cccc:"missed", c9daf8:"excused", ff9900:"excused", f1c232:"top3", ffff00:"quit", e6ef18:"quit", "00ff00":"new"};
const flagOf = c => FLAG[String(c || "").replace("#", "").toLowerCase()] || "";
const colIdx = s => s.toUpperCase().split("").reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
function hiddenFor(label){
  const spec = (CONFIG.hiddenColumns || {})[label.trim()] || "", out = [];
  spec.split(",").forEach(p => { const [a, b] = p.trim().split(":"); if (!a) return; const i = colIdx(a), k = b ? colIdx(b) : i; for (let x = i; x <= k; x++) out.push(x); });
  return out;
}
function buildMonth(name, rows, bg, hc, hr){
  const [label, , theme] = name.split(/( - )/);
  hc = new Set(Array.isArray(hc) ? hc : hiddenFor(label)); hr = new Set(hr || []);
  const pl = [], roles = {}, names = [];
  for (let i = 6; i < rows.length; i++){
    const raw = ((rows[i] || [])[0] || "").trim();
    if (/^(key|legend)$/i.test(raw)) break;
    if (!raw || hr.has(i)) continue;
    const m = raw.match(ROLE), nm = raw.replace(ROLE, "").trim();
    pl.push({i, nm}); names.push(nm); if (m) roles[nm] = m[1].toUpperCase();
  }
  // "Input Progress" row: the month only counts once it says Completed
  const prog = (rows[2] || []).join(" ");
  const done = /completed/i.test(prog) || !/in\s*progress/i.test(prog);
  const events = [], head = rows[0] || [], pf = {};
  if (bg) pl.forEach(({i, nm}) => { if (flagOf((bg[i] || [])[0]) === "quit") pf[nm] = "quit"; });
  for (let j = 1; j < head.length; j++){
    const title = (head[j] || "").replace(/\s+/g, " ").trim();
    if (!title || hc.has(j) || /roster size/i.test(title)) continue;
    const s = {}, f = {};
    pl.forEach(({i, nm}) => {
      const c = cellParse((rows[i] || [])[j]);
      if (c.v != null) s[nm] = c.v;
      const fl = c.flag || (bg ? flagOf((bg[i] || [])[j]) : ""); if (fl) f[nm] = fl;
    });
    const vals = Object.values(s);
    if (!vals.length) continue;
    const ty = kind(title);
    events.push({t: title, ty, m: (ty === "Rank" || ty === "Average" || (vals.length >= 3 && Math.max(...vals) <= 100)) ? "rank" : "score",
      op: num((rows[5] || [])[j]), fr: rankNum((rows[3] || [])[j]), fs: num((rows[4] || [])[j]), s, f});
  }
  const qc = {};
  events.forEach(e => Object.entries(e.f).forEach(([p, fl]) => { if (fl === "quit") qc[p] = (qc[p] || 0) + 1; }));
  Object.keys(qc).forEach(p => { pf[p] = "quit"; });   // a single (QF) in the sheet means they quit
  return {label: label.trim(), theme: (theme || "").trim(), events, pf, roles, players: names, done};
}
async function discoverTabs(base){
  const res = await fetch(base + "pubhtml", {cache: "no-store"});
  if (!res.ok) throw new Error("couldn't list the tabs (HTTP " + res.status + ")");
  const txt = await res.text(), tabs = [];
  const re = /name:\s*"((?:[^"\\]|\\.)*)"\s*,\s*pageUrl:\s*"((?:[^"\\]|\\.)*)"/g;
  let m;
  while ((m = re.exec(txt))){
    const g = m[2].match(/gid=(\d+)/); if (!g) continue;
    let nm = m[1].replace(/\\x([0-9a-fA-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16))).replace(/\\\//g, "/").replace(/\\"/g, '"');
    tabs.push({name: nm, gid: g[1]});
  }
  if (!tabs.length) throw new Error("couldn't find the tab list in the published page");
  return tabs;
}
async function loadLive(){
  if (CONFIG.scriptUrl){
    const r = await fetch(CONFIG.scriptUrl, {cache: "no-store"});
    if (!r.ok) throw new Error("the Apps Script link returned HTTP " + r.status);
    let data;
    try { data = await r.json(); }
    catch (e) { throw new Error("the Apps Script link didn't return data. Redeploy it with access set to Anyone"); }
    const k = data.findIndex(t => t.name.toLowerCase().startsWith(CONFIG.firstMonth.toLowerCase()));
    return data.slice(k >= 0 ? k : 0).map(t => buildMonth(t.name, t.rows, t.bg, t.hc, t.hr));
  }
  const base = `https://docs.google.com/spreadsheets/d/e/${CONFIG.publishKey}/`;
  let tabs = CONFIG.tabs.length ? CONFIG.tabs : await discoverTabs(base);
  const i = tabs.findIndex(t => t.name.toLowerCase().startsWith(CONFIG.firstMonth.toLowerCase()));
  if (i >= 0) tabs = tabs.slice(i);
  const months = await Promise.all(tabs.map(async t => {
    const r = await fetch(`${base}pub?gid=${t.gid}&single=true&output=csv`, {cache: "no-store"});
    if (!r.ok) throw new Error(`couldn't read the "${t.name}" tab (HTTP ${r.status})`);
    return buildMonth(t.name, parseCSV(await r.text()));
  }));
  return months;
}

function derive(){
  M.forEach(m => { m.events = m.events.filter(e => e.ty !== "Rank" && e.ty !== "Average"); });
  // One profile per player: names match ignoring capitals and extra spaces; the latest spelling is used.
  const key = s => s.toLowerCase().replace(/\s+/g, " ").trim(), canon = {};
  M.forEach(m => [...(m.players || []), ...m.events.flatMap(e => Object.keys(e.s))].forEach(n => { canon[key(n)] = n.replace(/\s+/g, " ").trim(); }));
  const cn = n => canon[key(n)] || n;
  const remap = o => { const out = {}; Object.entries(o || {}).forEach(([k, v]) => { out[cn(k)] = v; }); return out; };
  M.forEach(m => { m.players = [...new Set((m.players || []).map(cn))]; m.roles = remap(m.roles); m.pf = remap(m.pf); m.events.forEach(e => { e.s = remap(e.s); e.f = remap(e.f); }); });
  // Zeros that must not count: players who quit (QF), players who joined (J) and excused results.
  const firstQuit = {};
  M.forEach((m, mi) => { if (!isDone(mi)) return; m.events.forEach((e, ei) => Object.entries(e.f).forEach(([p, fl]) => { if (fl === "quit" && !firstQuit[p]) firstQuit[p] = [mi, ei]; })); Object.keys(m.pf).forEach(p => { if (!firstQuit[p]) firstQuit[p] = [mi, 0]; }); });
  M.forEach((m, mi) => {
    const joined = new Set(); m.events.forEach(e => Object.entries(e.f).forEach(([p, fl]) => { if (fl === "new") joined.add(p); }));
    m.events.forEach((e, ei) => Object.keys(e.s).forEach(p => {
      if (e.s[p] !== 0) return;
      const q = firstQuit[p], afterQuit = q && (CONFIG.quitRemovesAllZeros || mi > q[0] || (mi === q[0] && ei >= q[1]));
      if (afterQuit || joined.has(p) || e.f[p] === "excused") delete e.s[p];
    }));
  });
  const lastM = M[M.length - 1];
  CUR = new Set(lastM ? (lastM.players || []).filter(p => (lastM.pf || {})[p] !== "quit") : []);
  // Management (in-progress months count for who holds a role now; scores still use completed months only): anyone with a role code in any month is management, whatever role (or no role) they have in other months.
  MG = {};
  M.forEach((m, mi) => (m.players || []).forEach(p => { (MG[p] || (MG[p] = [])).push({mi, code: (m.roles || {})[p] || ""}); }));
  Object.keys(MG).forEach(p => { if (!MG[p].some(x => x.code)) delete MG[p]; });
  M.forEach(m => m.events.forEach(e => {
    const ent = Object.entries(e.s); e.n = ent.length; e.pos = {};
    if (e.m === "rank") ent.forEach(([p, v]) => e.pos[p] = v);
    else { const sv = ent.map(x => x[1]).sort((a, b) => b - a); ent.forEach(([p, v]) => e.pos[p] = sv.indexOf(v) + 1); }
  }));
  allPlayers = [...new Set(M.flatMap(m => m.events.flatMap(e => Object.keys(e.s))))].sort((a, b) => a.localeCompare(b, undefined, {sensitivity: "base"}));
  allTypes = [...new Set(M.flatMap(m => m.events.map(e => e.ty)))];
  monthOpts = M.map((m, i) => ({v: i, l: m.label})).filter(o => isDone(o.v));
  typeOpts = allTypes.map(t => ({v: t, l: t}));
  $("#pl").innerHTML = allPlayers.map(p => `<option value="${esc(p)}">`).join("");
}

  if (fl === "excused") return "met";          // excused counts as met 1%
  if (v == null) return null;
  if (v >= e.op) return "met";

};
// Everyone with a 1% check in this contest, including excused players who have no score written.
function checks(e){

  const out = Object.entries(e.s).map(([p, v]) => ({p, v, st: status(e, v, p)}));
  Object.entries(e.f || {}).forEach(([p, fl]) => { if (fl === "excused" && e.s[p] == null) out.push({p, v: null, st: "met"}); });

}

function facStrength(evs, mi){
  const ok = evs.filter(facOk);
  const s = [...ok].sort((a, b) => a.fr - b.fr || (b.fs || 0) - (a.fs || 0));
  const n = Math.min(5, Math.floor(s.length / 2));
  const li = e => `<li><b>${esc(e.t)}</b><i>${ord(e.fr)} · ${esc(tl(e.ty))}</i></li>`;
  const by = {}, all = [];
  M.forEach((m, k) => { if (isDone(k)) m.events.forEach(e => { if (facOk(e)){ all.push({mi: k, e}); (by[e.ty] || (by[e.ty] = [])).push(e.fr); } }); });
  all.sort((a, b) => a.e.fr - b.e.fr || (b.e.fs || 0) - (a.e.fs || 0));
  const no = Math.min(5, Math.floor(all.length / 2));
  const lo = x => `<li><b>${esc(mon(x.mi) + ": " + x.e.t)}</b><i>${ord(x.e.fr)} · ${esc(x.e.ty)}</i></li>`;
  const types = Object.entries(by).map(([t, a]) => ({t, n: a.length, avg: a.reduce((x, y) => x + y, 0) / a.length, best: Math.min(...a), worst: Math.max(...a)})).sort((a, b) => a.avg - b.avg);
  const overall = all.length >= 2 ? `<h3 class="sec">Overall: every completed month</h3>
    <div class="facts">
      <div class="fact big"><b>${ord(all[0].e.fr)}</b><span>Strongest event overall<br>${esc(mon(all[0].mi) + ": " + all[0].e.t)}</span></div>
      <div class="fact big"><b>${ord(all[all.length-1].e.fr)}</b><span>Weakest event overall<br>${esc(mon(all[all.length-1].mi) + ": " + all[all.length-1].e.t)}</span></div>

    </div>

    </div>` : "";
  const month = (mi >= 0 && ok.length >= 2) ? `<h3 class="sec">Faction strongest and weakest contests: ${esc(M[mi].label)}</h3>
    <div class="grid">
      <div class="box top-b"><h3>Strongest ${n}</h3><ol>${s.slice(0, n).map(li).join("")}</ol></div>
      <div class="box bot-b"><h3>Weakest ${n}</h3><ol>${s.slice(-n).reverse().map(li).join("")}</ol></div>
    </div>` : "";
  const typeTbl = types.length > 1 ? `<div class="box" style="margin-bottom:14px"><h3>By contest type <span class="small">· all completed months, strongest first</span></h3><div class="wrap" style="border:0"><table><thead><tr><th>Type</th><th class="n">Contests</th><th class="n">Avg finish</th><th class="n">Best</th><th class="n">Worst</th></tr></thead><tbody>${types.map(x => `<tr><td>${esc(tl(x.t))}</td><td class="n">${x.n}</td><td class="n">${x.avg.toFixed(1)}</td><td class="n">${ord(x.best)}</td><td class="n">${ord(x.worst)}</td></tr>`).join("")}</tbody></table></div></div>` : "";
  return overall + month + typeTbl;
}

  $("#mo").value = mi;

    let rows = ps;
    if (mN) rows = mN[1] === "top" ? pool.slice(0, N) : pool.slice(-N).reverse();
    else if (sf === "below") rows = ps.filter(r => r.below > 0);
    else if (sf === "met") rows = ps.filter(r => r.below === 0 && r.met > 0);
    if (q) rows = rows.filter(r => r.p.toLowerCase().includes(q));
    const ptable = `<div class="wrap"><table><thead><tr><th>Player</th><th class="n">Score</th><th class="n">Contests</th><th class="n">Met</th><th class="n">Below</th></tr></thead><tbody>
      ${rows.length ? rows.map(r => `<tr><td>${esc(r.p)}${rosterPill(r.p)}</td><td class="n">${Math.round(r.avg)}</td><td class="n">${r.n}</td><td class="n" style="color:var(--met)">${r.met}</td><td class="n" style="color:var(--below)">${r.below}</td></tr>`).join("")
        : '<tr><td colspan="5" class="empty">No players match.</td></tr>'}
      </tbody></table></div>`;
    if (q) return html($("#out"), `${ip}<h2>${esc(title)}: players</h2>${ptable}`);
    const tally = e => { let met = 0, below = 0; checks(e).forEach(x => { if (x.st === "met") met++; else if (x.st === "below") below++; }); return {met, below}; };
    html($("#out"), `
      ${ip}<h2>${esc(title)}: overview</h2>
      ${facStrength(items.map(x => x.e), mi)}

      <div class="wrap"><table><thead><tr>${allM ? "<th>Month</th>" : ""}<th>Contest</th><th>Type</th><th class="n">Faction position</th><th class="n">Faction score</th><th class="n">1% value</th><th class="n">Players</th><th class="n">Met / Below</th></tr></thead><tbody>
      ${items.map(x => { const e = x.e, t = tally(e); return `<tr data-mi="${x.k}" data-ei="${x.i}" style="cursor:pointer">${allM ? `<td>${esc(mon(x.k))}${isDone(x.k) ? "" : " (in progress)"}</td>` : ""}<td>${esc(e.t)}</td><td>${esc(tl(e.ty))}</td><td class="n">${ord(e.fr)}</td><td class="n">${fmt(e.fs)}</td><td class="n">${e.op ? short(e.op) : "—"}</td><td class="n">${e.n}</td><td class="n">${e.op && e.m === "score" ? t.met + " / " + t.below : "—"}</td></tr>`; }).join("")}
      </tbody></table></div>
      <h3 class="sec">Players${allM ? " (completed months)" : " this month"}</h3>
      <div class="grid">
        <div class="box top-b"><h3>Top ${N}</h3><ol>${pool.slice(0, N).map(li).join("")}</ol></div>
        <div class="box bot-b"><h3>Bottom ${N}</h3><ol>${pool.slice(-N).reverse().map(li).join("")}</ol></div>
      </div>
      ${ptable}
      <p class="small">${items.length} contests. Tap a contest to open it. Player scores are each player's average position across these contests (100 = top of the field).${allM ? " Players' scores use completed months only; an in-progress month is listed for checking." : ""} Faction strongest and weakest use the faction's finishing position from the sheet (1st is best).</p>`);
  }

  function draw(){
    if ($("#ev").value === "all") return drawAll();
    const ev = M[mi] && M[mi].events[+$("#ev").value];
    if (!ev || $("#ev").value === "") return html($("#out"), '<div class="empty">No contests match.</div>');
    const isRank = ev.m === "rank";
    const sorted = Object.entries(ev.s).map(([p,v]) => ({p, v, pos: ev.pos[p], st: status(ev, v, p)}))
      .sort((a,b) => isRank ? a.v - b.v : b.v - a.v);

        <div class="fact"><b>${ev.op ? short(ev.op) : "—"}</b><span>1% value</span></div>
        <div class="fact"><b>${esc(tl(ev.ty))}</b><span>Type</span></div>
        ${ev.op && !isRank ? `<div class="fact"><b style="color:var(--met)">${cnt.met}</b><span>Met 1%</span></div><div class="fact"><b style="color:var(--below)">${cnt.below}</b><span>Below 1%</span></div>` : ""}
        <div class="fact"><b>${sorted.length}</b><span>Players listed</span></div>
      </div>
      ${q ? "" : `<div class="grid">
        <div class="box top-b"><h3>Top ${N}</h3><ol>${top.map(li).join("")}</ol></div>
        <div class="box bot-b"><h3>Bottom ${N}</h3><ol>${bot.map(li).join("")}</ol></div>
      </div>`}
      <div class="wrap"><table><thead><tr><th class="n">Position</th><th>Player</th><th class="n">${isRank?"Rank":"Score"}</th><th>Progress to 1% value</th><th class="n">% of target</th><th>Status</th></tr></thead><tbody>

      <p class="small">The bar fills to 2× the 1% value; the vertical line marks the target.${isRank ? " This contest only has each player's rank (1 is best), not a score, so it can't be checked against the 1% value." : !ev.op ? " No 1% value was recorded for this contest." : ""}</p>`);
  }
  draw();
}

/* ============ PERFORMANCE ============ */
// Performance score: average position across contests, scaled 0-100 (100 = top of the field, 50 = middle).
const PCT = (e, p) => e.n > 1 ? (1 - (e.pos[p] - 1) / (e.n - 1)) * 100 : 100;
function perfStats(mSel, types){
  const mc = M.map(m => m.events.filter(inStats).length);   // contests in each month, whatever the filter
  const P = {}, rec = p => P[p] || (P[p] = {p, n:0, sum:0, low:0, top:0, met:0, below:0, mo:{}});
  M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => {
    if ((!inStats(e) && !(types && types.includes(e.ty))) || e.ty === "Rank" || e.ty === "Average" || (types && !types.includes(e.ty))) return;
    Object.keys(e.s).forEach(p => {
      const r = rec(p);
      const x = PCT(e, p); r.n++; r.sum += x; if (x <= 25 && lowOk({st: status(e, e.s[p], p)})) r.low++; if (x >= 75) r.top++;
      const o = r.mo[mi] || (r.mo[mi] = {sum:0, n:0}); o.sum += x; o.n++;
    });
    checks(e).forEach(({p, st}) => { const r = rec(p); if (st === "met") r.met++; else if (st === "below") r.below++; });
  }); });
  return Object.values(P).filter(r => r.n > 0).map(r => {
    const ms = Object.keys(r.mo).map(Number).sort((a, b) => a - b).map(mi => ({mi, avg: r.mo[mi].sum / r.mo[mi].n, n: r.mo[mi].n}));
    let delta = null, earlier = null; const counted = ms.filter(x => mc[x.mi] >= CONFIG.minMonthContests), latest = counted[counted.length - 1] || null;
    if (counted.length >= 2){ const prev = counted.slice(0, -1); earlier = prev.reduce((s, x) => s + x.avg, 0) / prev.length; delta = latest.avg - earlier; }
    const left = roster(r.p) === "quit";   // players who quit are not part of growth / decline
    if (left){ delta = null; earlier = null; }
    return {...r, avg: r.sum / r.n, ms, counted, latest, delta, earlier, trend: left ? "Left" : delta == null ? "New" : delta >= CONFIG.trendPoints ? "Improving" : delta <= -CONFIG.trendPoints ? "Declining" : "Steady"};
  });
}
const trendTxt = r => r.trend === "Left" ? "Left faction" : r.delta == null ? "—" : r.trend === "Improving" ? `<span class="up">↑ +${Math.round(r.delta)}</span>` : r.trend === "Declining" ? `<span class="down">↓ ${Math.round(r.delta)}</span>` : "→ steady";
const hitTxt = r => (r.met + r.below) ? Math.round(r.met / (r.met + r.below) * 100) + "% (" + r.met + "/" + (r.met + r.below) + ")" : "—";

function growthExplainer(all){
  const cand = all.filter(r => r.counted && r.counted.length >= 3 && roster(r.p) !== "quit" && r.counted.every(x => x.n >= 3));
  const ex = (cand.length ? cand : all.filter(r => r.delta != null)).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))[0];
  const last = ex && ex.latest;
  const sign = ex && ex.delta > 0 ? "+" : "";
  return `<details class="box" open style="margin-bottom:14px"><summary><b>How growth and decline are calculated</b></summary>
    <ol class="steps">
      <li><b>Contest score (0 to 100).</b> Each contest turns a player's position into a score: (1 − (position − 1) ÷ (players − 1)) × 100. First place scores 100, the middle of the field about 50, last place 0.</li>
      <li><b>Month average.</b> The average of a player's contest scores in that month.</li>
      <li><b>Earlier average.</b> The average of their monthly averages before the latest month.</li>
      <li><b>Change.</b> Latest month average minus earlier average.</li>
      <li><b>Verdict.</b> ${CONFIG.trendPoints} points or more up = <span class="up">Improving</span>. ${CONFIG.trendPoints} points or more down = <span class="down">Declining</span>. Anything between is Steady. A player with only one month has no trend yet.</li>
    </ol>
    ${ex ? `<p><b>Example from your data:</b> ${esc(ex.p)} scored ${ex.counted.map(x => esc(mon(x.mi)) + " " + Math.round(x.avg)).join(", ")}. Earlier average ${Math.round(ex.earlier)}, latest month (${esc(mon(last.mi))}) ${Math.round(last.avg)}, so the change is ${sign}${Math.round(ex.delta)} points: <b>${ex.trend}</b>.</p>` : ""}
    <p class="small">Each month counts equally, whether it had 3 contests or 10, and a month only counts toward the trend once it has at least ${CONFIG.minMonthContests} contests, so a month that is still filling in is shown but not used. Only the flash feud combined total is used, not flash feuds 1 to 4. The ${CONFIG.trendPoints} point threshold can be changed in the settings at the top of the file.</p></details>`;
}

function viewPerf(){
  const mSel = doneSet();
  html($("#controls"), `<label class="f">Search player<input type="search" id="pq" list="pl" placeholder="Type a name" autocomplete="off"></label>
    <label class="f">Contests<select id="cat">${catKeys().map(k=>`<option>${esc(k)}</option>`).join("")}</select></label>`);
  $("#controls").append(multi("Months", monthOpts, mSel, draw));
  $("#pq").oninput = draw; $("#cat").onchange = draw;
  function draw(){
    const all = perfStats(mSel, CATS[$("#cat").value]).sort((a, b) => b.avg - a.avg || b.n - a.n).map((r, i) => ({...r, i: i + 1}));
    if (!all.length) return html($("#out"), '<div class="empty">No data for these filters.</div>');
    const q = $("#pq").value.trim().toLowerCase();
    const table = rows => `<div class="wrap"><table><thead><tr><th class="n">#</th><th>Player</th><th class="n">Contests</th><th class="n">Score</th><th>Trend</th><th class="n">Earlier → latest</th><th>Month by month</th><th class="n">In bottom 25%</th><th class="n">1% hit rate</th></tr></thead><tbody>
      ${rows.length ? rows.map(r=>`<tr><td class="n">${r.i}</td><td>${esc(r.p)}${rosterPill(r.p)}</td><td class="n">${r.n}</td><td class="n">${Math.round(r.avg)}</td><td>${trendTxt(r)}</td><td class="n">${r.delta == null ? "—" : Math.round(r.earlier) + " → " + Math.round(r.latest.avg)}</td><td class="small">${r.ms.map(x => mon(x.mi) + " " + Math.round(x.avg)).join(" · ")}</td><td class="n">${r.low} of ${r.n} (${Math.round(r.low / r.n * 100)}%)${flagBottom(r) ? ' <span class="pill below">Flag</span>' : ""}</td><td class="n">${hitTxt(r)}</td></tr>`).join("")
        : '<tr><td colspan="9" class="empty">No players match.</td></tr>'}
      </tbody></table></div>`;
    if (q){   // searching: the player's own information goes straight to the top
      const rows = all.filter(r => r.p.toLowerCase().includes(q)), exact = all.find(r => r.p.toLowerCase() === q);
      return html($("#out"), (exact ? `<h2>${esc(exact.p)}${rosterPill(exact.p)}</h2>` + reviewPanel(exact, exact.i, all.length, playerRows(exact.p, mSel)) : "") + table(rows) + '<p class="small">Clear the search box to see the top 20, bottom 20 and growth lists.</p>');
    }
    const maxN = Math.max(...all.map(r => r.n)), pool = all.filter(r => r.n >= Math.ceil(maxN / 2));
    const grow = pool.filter(r => r.delta != null && r.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 10);
    const fall = pool.filter(r => r.delta != null && r.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 10);
    const li = r => `<li><b>${esc(r.p)}${rosterPill(r.p)}</b><i>${Math.round(r.avg)} · ${trendTxt(r)}</i></li>`;
    const liD = r => `<li><b>${esc(r.p)}${rosterPill(r.p)}</b><i>${Math.round(r.earlier)} → ${Math.round(r.latest.avg)} (${r.delta > 0 ? "+" : ""}${Math.round(r.delta)})</i></li>`;
    const none = '<li><i>None yet</i></li>';
    const flagged = all.filter(r => flagBottom(r) && roster(r.p) !== "quit").sort((a, b) => b.low / b.n - a.low / a.n || b.n - a.n);
    const liB = r => `<li><b>${esc(r.p)}</b><i>${r.low} of ${r.n} contests (${Math.round(r.low / r.n * 100)}%)</i></li>`;
    html($("#out"), `
      <div class="box bot-b" style="margin-bottom:14px"><h3>Consistently in the bottom 25% <span class="small">· in the bottom quarter in ${CONFIG.consistentBottomShare}% or more of their contests (at least ${CONFIG.consistentBottomMin} contests)</span></h3><ol>${flagged.length ? flagged.map(liB).join("") : "<li><i>No one is flagged</i></li>"}</ol></div>

      <div class="grid">
        <div class="box top-b"><h3>Top 20 performers</h3><ol>${pool.slice(0, 20).map(li).join("")}</ol></div>
        <div class="box bot-b"><h3>Bottom 20 performers</h3><ol>${pool.slice(-20).reverse().map(li).join("")}</ol></div>
      </div>
      <div class="grid">
        <div class="box top-b"><h3>Growing (most improved)</h3><ol>${grow.length ? grow.map(liD).join("") : none}</ol></div>
        <div class="box bot-b"><h3>Declining</h3><ol>${fall.length ? fall.map(liD).join("") : none}</ol></div>
      </div>
      ${table(all)}
      ${growthExplainer(all)}
      <p class="note">Performance score = a player's average position across contests, scaled 0 to 100 (100 = top of the field, 50 = middle). Trend compares the latest month with earlier months; a move of ${CONFIG.trendPoints} points or more counts as improving or declining (see the breakdown above this note). Top and bottom 20 only include players in at least ${Math.ceil(maxN/2)} contests. In the bottom 25% means finishing in the lowest quarter of the field in a contest; a result that met the 1% value is never counted as bottom quarter. Only the flash feud combined total counts, not flash feuds 1 to 4.</p>`);
  }
  draw();
}

function playerRows(name, mSel){
  const out = [];
  M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => { if (inStats(e) && e.s[name] != null) out.push({mi, e, v: e.s[name], pos: e.pos[name], st: status(e, e.s[name], name)}); }); });
  return out;
}
function reviewPanel(me, rk, total, mine){
  if (!me) return "";
  const lab = r => mon(r.mi) + ": " + r.e.t;
  const lvl = me.avg >= 75 ? "a top performer" : me.avg >= 55 ? "above average" : me.avg >= 40 ? "mid-table" : me.avg >= 25 ? "below average" : "near the bottom of the faction";
  const d = me.delta == null ? 0 : Math.abs(Math.round(me.delta));
  const best = [...mine].filter(r => r.e.ty !== "Rank" && r.e.ty !== "Average").sort((a, b) => a.pos / a.e.n - b.pos / b.e.n)[0];
  const lines = [
    `${esc(me.p)} is <b>${lvl}</b>: score ${Math.round(me.avg)} out of 100, number ${rk} of ${total} players.`,
    me.delta == null ? "Not enough finished months yet to show a trend."
      : me.trend === "Improving" ? `<span class="up">Improving:</span> up ${d} points on earlier months (${Math.round(me.earlier)} → ${Math.round(me.latest.avg)}).`
      : me.trend === "Declining" ? `<span class="down">Declining:</span> down ${d} points on earlier months (${Math.round(me.earlier)} → ${Math.round(me.latest.avg)}).` : "Trend is steady compared with earlier months.",
    flagBottom(me) ? `<span class="down">Flag: consistently in the bottom 25%</span> (${me.low} of ${me.n} contests, ${Math.round(me.low / me.n * 100)}%).`
      : me.low ? `In the bottom 25% in ${me.low} of ${me.n} contests (${Math.round(me.low / me.n * 100)}%). That is not constant, so no flag.` : "Never in the bottom 25% of a contest.",
    (me.met + me.below) ? `Met the 1% value in ${me.met} of ${me.met + me.below} contests (${Math.round(me.met / (me.met + me.below) * 100)}%).` : "",
    best ? `Best result: ${esc(lab(best))} (position ${best.pos} of ${best.e.n}).` : ""
  ].filter(Boolean);
  return `<h3 class="sec">Performance review</h3>
    <div class="review">${lines.map(l => `<p>${l}</p>`).join("")}</div>
    <div class="box" style="margin-bottom:14px"><h3>Average position by month <span class="small">· 100 = top of the field</span></h3>
      ${me.ms.map(x => `<div class="mbar"><b>${esc(mon(x.mi))}</b><div><i class="${x.avg >= 60 ? "hi" : x.avg <= 35 ? "lo" : ""}" style="width:${Math.max(2, x.avg)}%"></i></div><span>${Math.round(x.avg)} · ${x.n} contests</span></div>`).join("")}</div>`;
}

/* ============ PLAYER VIEW ============ */
const statFact = (b, s, sub) => `<div class="fact"><b>${b}</b><span>${s}${sub ? "<br>" + esc(sub) : ""}</span></div>`;
function playerStats(mine, N = 5){
  const core = mine.filter(r => r.e.ty !== "Rank" && r.e.ty !== "Average");
  if (!core.length) return "";
  const lab = r => mon(r.mi) + ": " + r.e.t;
  const GROUPS = [["Kick offs", ["Kick Off"]], ["Feuds", ["Feud"]], ["Flash feuds (combined total)", ["Flash Feud Total"]], ["Faction contests", ["Faction Contest", "Loot Contest", "Boss Battle"]], ["Showdown contests", ["Showdown Contest"]]];
  const cards = GROUPS.map(([label, types]) => {
    const rs = core.filter(r => types.includes(r.e.ty)); if (!rs.length) return "";
    const sc = rs.filter(r => r.e.m === "score"), rk = rs.filter(r => r.e.m === "rank");
    let facts = "";
    if (sc.length){
      const hi = sc.reduce((a, r) => r.v > a.v ? r : a), scLow = sc.filter(lowOk), lo = scLow.length ? scLow.reduce((a, r) => r.v < a.v ? r : a) : null, avg = sc.reduce((s, r) => s + r.v, 0) / sc.length;
      facts += statFact(fmt(hi.v), "Best score", lab(hi)) + (lo ? statFact(fmt(lo.v), "Lowest score", lab(lo)) : statFact("—", "Lowest score", sc.every(r => r.st === "met") ? "met the 1% value every time" : "none below target")) + statFact(fmt(avg), "Average score");
    }
    if (rk.length){
      const b = rk.reduce((a, r) => r.v < a.v ? r : a), w = rk.reduce((a, r) => r.v > a.v ? r : a);
      facts += statFact("Rank " + fmt(b.v), "Best rank", lab(b)) + statFact("Rank " + fmt(w.v), "Worst rank", lab(w));
    }

}

// Average position per player across contests (1 = best). Position comes from the scores (or the rank the sheet records).
function posStats(mSel, types){
  const P = {};
  M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => {
    if (!inStats(e) || (types && !types.includes(e.ty))) return;
    Object.keys(e.s).forEach(p => {
      const x = e.pos[p], r = P[p] || (P[p] = {p, n:0, sum:0, best:Infinity, worst:0, list:[]});
      r.n++; r.sum += x; r.best = Math.min(r.best, x); r.worst = Math.max(r.worst, x);
      r.list.push(mon(mi) + ": " + e.t + " (position " + x + " of " + e.n + ")");
    });
  }); });
  return Object.values(P).map(r => ({...r, avg: r.sum / r.n}));
}

// Faction position (row "Faction Event Rank") and faction score for every contest. Lower position = better.
function factionChart(pts){
  const W = 720, H = 240, L = 46, R = 12, T = 14, B = 38, iw = W - L - R, ih = H - T - B;
  const vals = pts.map(p => p.fr), lo = Math.max(1, Math.min(...vals) - 1), hi = Math.max(...vals) + 1;
  const sp = pts.length > 1 ? iw / (pts.length - 1) : 60;
  const X = i => pts.length === 1 ? L + iw / 2 : L + sp * i;
  const Y = v => T + (v - lo) / ((hi - lo) || 1) * ih;
  const step = Math.max(1, Math.ceil((hi - lo) / 6));
  let g = "";
  for (let v = Math.ceil(lo); v <= hi; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" style="fill:var(--mute);font-size:11px">${ord(v)}</text>`;
  let bands = "", k = 0;
  for (let a = 0; a < pts.length; ){
    let b = a; while (b + 1 < pts.length && pts[b+1].mi === pts[a].mi) b++;
    const x0 = Math.max(L, X(a) - sp / 2), x1 = Math.min(W - R, X(b) + sp / 2);
    if (k % 2 === 0) bands += `<rect x="${x0}" y="${T}" width="${x1 - x0}" height="${ih}" style="fill:var(--soft)"/>`;
    bands += `<text x="${(x0 + x1) / 2}" y="${H - 14}" text-anchor="middle" style="fill:var(--mute);font-size:12px">${esc(mon(pts[a].mi))}</text>`;
    k++; a = b + 1;
  }
  const line = pts.length > 1 ? `<polyline fill="none" stroke-width="2" points="${pts.map((p, i) => X(i) + "," + Y(p.fr)).join(" ")}" style="stroke:var(--accent)"/>` : "";
  const dots = pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.fr)}" r="4.5" style="fill:var(--accent);stroke:var(--panel);stroke-width:2"><title>${esc(mon(p.mi) + ": " + p.e.t + " · " + ord(p.fr))}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Faction position by contest">${bands}${g}${line}${dots}</svg>`;
}
function viewFaction(){
  const mSel = doneSet();
  html($("#controls"), `<label class="f">Contests<select id="cat">${catKeys().map(k=>`<option>${esc(k)}</option>`).join("")}</select></label>`);
  $("#controls").append(multi("Months", monthOpts, mSel, draw));
  $("#cat").onchange = draw;
  function draw(){
    const types = CATS[$("#cat").value], pts = [];
    M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => { if (inStats(e) && e.fr != null && (!types || types.includes(e.ty))) pts.push({mi, e, fr: e.fr}); }); });
    if (!pts.length) return html($("#out"), '<div class="empty">No faction results for these filters.</div>');
    const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
    const byM = {}; pts.forEach(p => (byM[p.mi] || (byM[p.mi] = [])).push(p.fr));
    const ms = Object.keys(byM).map(Number).sort((a, b) => a - b).map(mi => ({mi, v: byM[mi], avg: avg(byM[mi]), best: Math.min(...byM[mi]), worst: Math.max(...byM[mi])}));
    const mcnt = {}; M.forEach((m, mi) => { if (mSel.has(mi)) mcnt[mi] = m.events.filter(e => inStats(e) && e.fr != null).length; });
    const msOk0 = ms.filter(x => mcnt[x.mi] >= CONFIG.minMonthContests), msOk = msOk0.length ? msOk0 : ms;
    let move = null;
    if (msOk.length >= 2){ const earlier = avg(msOk.slice(0, -1).map(x => x.avg)); move = earlier - msOk[msOk.length-1].avg; }  // positive = moved up the table
    const trend = move == null ? "Not enough months yet" : move >= 1 ? `<span class="up">Improving: ${move.toFixed(1)} places higher</span>` : move <= -1 ? `<span class="down">Declining: ${Math.abs(move).toFixed(1)} places lower</span>` : "Steady";
    const fr = pts.map(p => p.fr);
    const hitFor = mi => { let met = 0, below = 0; const miss = new Set(); M[mi].events.forEach(e => { if (!inStats(e) || e.m !== "score" || !e.op || (types && !types.includes(e.ty))) return; checks(e).forEach(({p, st}) => { if (st === "met") met++; else if (st === "below"){ below++; miss.add(p); } }); }); return {met, below, miss: miss.size}; };
    let hm = null; for (let k = msOk.length - 1; k >= 0 && !hm; k--){ const x = hitFor(msOk[k].mi); if (x.met + x.below > 0) hm = {...x, mi: msOk[k].mi}; }
    const hit = hm ? hm.met / (hm.met + hm.below) * 100 : null;
    const posBad = move != null && move <= -1, posGood = move != null && move >= 1;
    const hitBad = hit != null && hit < CONFIG.healthWeakHit, hitGood = hit != null && hit >= CONFIG.healthGoodHit;
    const level = (posBad || hitBad) ? "attention" : (posGood || hitGood) ? "strong" : "steady";
    const LABEL = {strong: "Strong", steady: "Steady", attention: "Needs attention"};
    const reasons = [
      move == null ? "Faction position: not enough months yet to show a trend." : posGood ? `Faction position: ${move.toFixed(1)} places higher than earlier months.` : posBad ? `Faction position: ${Math.abs(move).toFixed(1)} places lower than earlier months.` : "Faction position: steady against earlier months.",
      hm ? `Player 1% hit rate in ${esc(M[hm.mi].label)}: ${Math.round(hit)}% (${hm.met} of ${hm.met + hm.below} checks met, ${hm.miss} players below at least once).` : "Player 1% hit rate: no contests with a score and a 1% value yet."
    ];
    const overview = `<div class="health ${level}"><div class="hbadge">${LABEL[level]}</div><div><h2 style="margin:0 0 4px">Faction overview</h2><ul>${reasons.map(r => `<li>${r}</li>`).join("")}</ul>
      <p class="small">Months with fewer than ${CONFIG.minMonthContests} contests are left out until they fill in. Health combines two things: where the faction finishes (latest finished month against earlier months) and how many player checks met their 1% value. Needs attention = finishing lower, or a hit rate under ${CONFIG.healthWeakHit}%. Strong = nothing slipping and either finishing higher or a hit rate of ${CONFIG.healthGoodHit}% or more. Otherwise Steady.</p></div></div>`;
    const cats = catKeys().filter(k => CATS[k]);
    const monthData = [...mSel].sort((a, b) => a - b).map(mi => {
      const evs = M[mi].events.filter(e => inStats(e) && e.fr != null);
      if (!evs.length) return null;
      const by = {};
      cats.forEach(k => { const g = evs.filter(e => CATS[k].includes(e.ty)).map(e => e.fr); if (g.length) by[k] = {best: Math.min(...g), avg: avg(g), n: g.length}; });
      const fl = M[mi].events.filter(e => e.ty === "Flash Feud" && e.fr != null).map(e => e.fr);
      if (fl.length) by["Flash feuds (1 to 4)"] = {best: Math.min(...fl), avg: avg(fl), n: fl.length};
      return {mi, n: evs.length, avg: avg(evs.map(e => e.fr)), by};
    }).filter(Boolean);
    const FLK = "Flash feuds (1 to 4)";
    const usedCats = [...cats, FLK].filter(k => monthData.some(x => x.by[k]));
    const CL = {"Flash feuds (1 to 4)": "Flash feuds 1-4 (best)", "Kick offs": "Kick off", "Feuds": "Feuds (best)", "Flash feuds (combined total)": "Flash feud total", "Faction contests": "Faction contests (best)", "Showdown contests": "Showdown (best)", "Loot contests": "Loot (best)", "Boss battles": "Boss battle (best)"};
    const monthTable = `<h3 class="sec">Month by month</h3>
      <div class="wrap"><table><thead><tr><th>Month</th><th class="n">Contests</th><th class="n">Avg position</th><th>Change vs last month</th>${usedCats.map(k => `<th class="n">${esc(CL[k] || k)}</th>`).join("")}</tr></thead><tbody>
      ${monthData.map((x, i) => { const d = i ? monthData[i-1].avg - x.avg : null; return `<tr><td>${esc(M[x.mi].label)}</td><td class="n">${x.n}${x.n < CONFIG.minMonthContests ? " (still filling in)" : ""}</td><td class="n">${x.avg.toFixed(1)}</td><td>${d == null ? "—" : d >= 0.5 ? `<span class="up">▲ ${d.toFixed(1)}</span>` : d <= -0.5 ? `<span class="down">▼ ${Math.abs(d).toFixed(1)}</span>` : "→ steady"}</td>${usedCats.map(k => { const c = x.by[k]; return `<td class="n">${c ? `<b>${ord(c.best)}</b><div class="small">${c.n === 1 ? "1 contest" : "avg " + c.avg.toFixed(1) + " · " + c.n + " contests"}</div>` : "—"}</td>`; }).join("")}</tr>`; }).join("")}
      </tbody></table></div>
      <p class="note">Faction finish for each type of contest. Best = the faction's highest finish in that group that month; avg = the average finish. 1st is best. This table always shows every contest type.</p>
`;
    html($("#out"), `
      ${overview}
      <h3 class="sec" style="margin-top:4px">Positions and scores</h3>
      <div class="facts">
        <div class="fact big"><b>${avg(fr).toFixed(1)}</b><span>Average faction position</span></div>
        <div class="fact big"><b>${ord(Math.min(...fr))}</b><span>Best finish</span></div>
        <div class="fact big"><b>${ord(Math.max(...fr))}</b><span>Worst finish</span></div>
        <div class="fact"><b>${pts.length}</b><span>Contests tracked</span></div>
        <div class="fact"><b>${fr.filter(x => x <= 10).length}</b><span>Top 10 finishes</span></div>
        <div class="fact"><b style="font-size:1.1rem">${trend}</b><span>Latest month vs earlier months</span></div>
      </div>
      <div class="box" style="margin-bottom:14px"><h3>Faction position by contest <span class="small">· higher on the chart is better. Tap a dot to see the contest.</span></h3>${factionChart(pts)}</div>
      ${monthTable}
      <h3 class="sec">Every contest</h3>
      <div class="wrap"><table><thead><tr><th>Month</th><th>Contest</th><th>Type</th><th class="n">Faction position</th><th class="n">Faction score</th><th>Move</th></tr></thead><tbody>
      ${pts.map((p, i) => { const d = i ? pts[i-1].fr - p.fr : null; return `<tr><td>${esc(mon(p.mi))}</td><td>${esc(p.e.t)}</td><td>${esc(p.e.ty)}</td><td class="n">${ord(p.fr)}</td><td class="n">${fmt(p.e.fs)}</td><td>${d == null ? "—" : d > 0 ? `<span class="up">▲ ${d}</span>` : d < 0 ? `<span class="down">▼ ${Math.abs(d)}</span>` : "→"}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p class="small">Move compares each contest with the one before it. Positions are the faction's "Faction Event Rank" from the sheet, so 1st is best.</p>`);
  }
  draw();
}

/* ============ WATCHLIST VIEW ============ */
// Who has missed the 1% value written in the sheet (14k, 120m, 1.8m ...). Used to decide who needs to leave.
function viewWatch(){
  const mSel = doneSet(), tSel = new Set(allTypes);
  html($("#controls"), `<label class="f">Search player<input type="search" id="pq" list="pl" placeholder="Type a name" autocomplete="off"></label>
    <label class="f">Show<select id="sf"><option value="below">Below 1% at least once</option><option value="all">All players</option><option value="clean">Met every 1% value</option></select></label>`);
  $("#controls").append(multi("Months", monthOpts, mSel, draw), multi("Contest types", typeOpts, tSel, draw));
  $("#pq").oninput = draw; $("#sf").onchange = draw;
  function draw(){
    const P = {};
    M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => {
      if (!inStats(e) || !tSel.has(e.ty) || e.m !== "score" || !e.op) return;
      checks(e).forEach(({p, v, st}) => {
        const r = P[p] || (P[p] = {p, met:0, below:0, ex:0, miss:[]});
        if (st === "met") r.met++;
        else if (st === "quit") r.ex++;
        else { r.below++; r.miss.push(mon(mi) + ": " + e.t + " (" + fmt(v) + " / " + short(e.op) + ")"); }
      });
    }); });
    const allP = Object.values(P).map(r => ({...r, n: r.met + r.below})).filter(r => r.n > 0).map(r => ({...r, pct: r.met / r.n}));
    const MINE = CONFIG.watchMinEvents, all = allP.filter(r => r.n >= MINE);
    const tooFew = allP.filter(r => r.n < MINE && isCurrent(r.p)).length;
    const ps = Object.fromEntries(posStats(mSel, [...tSel]).map(r => [r.p, r]));
    const ro = []; M.forEach((m, mi) => { if (mSel.has(mi)) m.events.forEach(e => { if (e.m === "rank" && e.op && tSel.has(e.ty)) ro.push(mon(mi) + ": " + e.t + " (1% value " + short(e.op) + ")"); }); });
    const q = $("#pq").value.trim().toLowerCase(), sf = $("#sf").value;
    const active = r => isCurrent(r.p);
    const missed = all.filter(r => r.below > 0 && active(r));
    const worst = [...missed].sort((a, b) => a.pct - b.pct || b.below - a.below).slice(0, 10);
    const pfs = perfStats(mSel, [...tSel]).filter(r => isCurrent(r.p) && r.n >= MINE && flagBottom(r));
    const stuck = pfs.filter(r => r.delta != null && r.delta < CONFIG.trendPoints).sort((a, b) => b.low / b.n - a.low / a.n || a.delta - b.delta);
    const noTrend = pfs.filter(r => r.delta == null).length;
    const li3 = r => `<li><b>${esc(r.p)}</b><i>${r.low} of ${r.n} in bottom 25% · ${Math.round(r.earlier)} → ${Math.round(r.latest.avg)} (${r.delta > 0 ? "+" : ""}${Math.round(r.delta)})</i></li>`;
    const top3 = worst.slice(0, 3);
    const chart3 = `<div class="box bot-b" style="margin-bottom:14px"><h3>Top 3 most at risk <span class="small">· lowest 1% hit rate among current players</span></h3>${top3.length ? top3.map(r => `<div class="mbar"><b style="width:140px;font:600 .95rem var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.p)}">${esc(r.p)}</b><div><i class="lo" style="width:${Math.max(2, Math.round(r.pct * 100))}%"></i></div><span style="width:120px">${Math.round(r.pct * 100)}% · ${r.below} missed</span></div>`).join("") : "<p class=\"small\">No one is below a 1% value.</p>"}</div>`;
    const stuckBox = `<div class="box bot-b" style="margin-bottom:14px"><h3>Constantly in the bottom 25% with no growth <span class="small">· bottom quarter in ${CONFIG.consistentBottomShare}% or more of contests and improving by less than ${CONFIG.trendPoints} points</span></h3><ol>${stuck.length ? stuck.map(li3).join("") : "<li><i>No one</i></li>"}</ol>${noTrend ? `<p class="small">${noTrend} more current player${noTrend === 1 ? " is" : "s are"} consistently in the bottom 25% but ${noTrend === 1 ? "doesn't" : "don't"} have enough finished months to judge growth yet.</p>` : ""}</div>`;
    const rows = [...all].sort((a, b) => a.pct - b.pct || b.below - a.below)
      .filter(r => active(r) && (q ? r.p.toLowerCase().includes(q) : (sf === "all" || (sf === "below" ? r.below > 0 : r.below === 0))));
    const li = r => `<li><b>${esc(r.p)}</b><i>${r.met}/${r.n} met · ${Math.round(r.pct*100)}%</i></li>`;
    html($("#out"), all.length ? `
      ${q ? "" : `<p class="note"><b>${missed.length}</b> player${missed.length === 1 ? "" : "s"} below at least one 1% value written in the sheet (14k, 120m, 1.8m and so on).</p>
      ${chart3}
      ${stuckBox}
      <div class="grid"><div class="box bot-b"><h3>Lowest hit rates (up to 10)</h3><ol>${worst.length ? worst.map(li).join("") : "<li><i>No one</i></li>"}</ol></div></div>`}
      <div class="wrap"><table><thead><tr><th>Player</th><th class="n">Contests checked</th><th class="n">Met</th><th class="n">Below</th><th class="n">Hit rate</th><th class="n">Avg position</th><th>Contests below 1% value</th></tr></thead><tbody>
      ${rows.length ? rows.map(r=>`<tr><td>${esc(r.p)}${rosterPill(r.p)}</td><td class="n">${r.n}</td><td class="n" style="color:var(--met)">${r.met}</td><td class="n" style="color:var(--below)">${r.below}</td><td class="n">${Math.round(r.pct*100)}%</td><td class="n">${ps[r.p] ? ps[r.p].avg.toFixed(1) : "—"}</td>
        <td class="small">${r.miss.length ? `<details><summary>${r.miss.length} below</summary>${r.miss.map(esc).join("<br>")}</details>` : "None"}${r.ex ? `<div>${r.ex} excused or left (not counted)</div>` : ""}</td></tr>`).join("")
        : '<tr><td colspan="7" class="empty">No current players match. Players who have left the faction aren\'t shown here.</td></tr>'}
      </tbody></table></div>${q ? "" : `<p class="small">The watchlist is compiled from players with at least ${MINE} checked contests${tooFew ? ` (${tooFew} current player${tooFew === 1 ? " has" : "s have"} fewer so far and ${tooFew === 1 ? "isn't" : "aren't"} listed)` : ""}. Only current players are shown: anyone listed in the latest month who hasn't quit. A blank cell means the player wasn't listed for that contest; a 0 counts as below. Players marked (EX) in the sheet count as met. Zeros are ignored for players who quit (QF) or joined (J). Only the flash feud combined total is checked, not flash feuds 1 to 4.</p>`}
      ${ro.length ? `<details class="small"><summary>${ro.length} contests have a 1% value but the sheet only records a rank, so they can't be checked. Show them.</summary>${ro.map(esc).join("<br>")}</details>` : ""}` : `<div class="empty">No player has ${MINE} or more contests with both a score and a 1% value for these filters.</div>`);
  }
  draw();
}

/* ============ TABS & START ============ */
const views = {event: viewEvent, player: viewPlayer, faction: viewFaction, perf: viewPerf, mgmt: viewMgmt, rank: viewRank, watch: viewWatch};
function go(v){
  current = v;
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  if (!M.length){ html($("#controls"), ""); return html($("#out"), '<div class="empty">No data to show yet.</div>'); }
  views[v]();
  document.querySelectorAll("#controls input[type=search]").forEach(i => { i.setAttribute("list", "pl"); i.setAttribute("autocomplete", "off"); });
  history.replaceState(null, "", "#" + v);
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));
$("#refresh").onclick = async () => { await load(); go(current); };
(async () => { await load(); go(views[location.hash.slice(1)] ? location.hash.slice(1) : "faction"); })();
</script>
